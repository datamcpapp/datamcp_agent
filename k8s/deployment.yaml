apiVersion: v1
kind: Namespace
metadata:
  name: datamcp

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datamcp-agent
  namespace: datamcp

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: datamcp-agent-config
  namespace: datamcp
data:
  DATAMCP_CLOUD_URL: "wss://api.datamcp.app"
  DATAMCP_CONNECTION_ID: "conn_replace_with_your_tunnel_id"
  DATAMCP_READ_ONLY: "true"
  AGENT_NAME: "Kubernetes Agent"
  HEARTBEAT_INTERVAL: "30000"
  LOG_LEVEL: "info"
  PORT: "3000"

---
apiVersion: v1
kind: Secret
metadata:
  name: datamcp-agent-secret
  namespace: datamcp
type: Opaque
stringData:
  agent-token: "agent_replace_with_your_scoped_token"
  database-url: "postgresql://read_only_user:password@postgres.internal:5432/app"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datamcp-agent
  namespace: datamcp
  labels:
    app: datamcp-agent
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datamcp-agent
  template:
    metadata:
      labels:
        app: datamcp-agent
        version: v1
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      # Service account
      serviceAccountName: datamcp-agent
      
      containers:
      - name: agent
        image: ghcr.io/datamcpapp/agent:latest
        imagePullPolicy: Always
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: datamcp-agent-config
        
        # Environment variables from Secret
        env:
        - name: DATAMCP_AGENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: datamcp-agent-secret
              key: agent-token
        - name: DATAMCP_DB_URL
          valueFrom:
            secretKeyRef:
              name: datamcp-agent-secret
              key: database-url
        
        # Ports
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        
        # Resource limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        # Liveness probe - is the agent running?
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness probe - is the agent connected to cloud?
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        
        # Volume mounts for writable directories
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      
      # Restart policy
      restartPolicy: Always
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: datamcp-agent
  namespace: datamcp
  labels:
    app: datamcp-agent
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: datamcp-agent
