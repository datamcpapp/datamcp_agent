services:
  datamcp-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datamcp-agent
    image: ghcr.io/datamcpapp/agent:latest
    
    # Environment variables
    environment:
      - DATAMCP_AGENT_TOKEN=${DATAMCP_AGENT_TOKEN}
      - DATAMCP_DB_URL=${DATAMCP_DB_URL}
      - DATAMCP_CONNECTION_ID=${DATAMCP_CONNECTION_ID}
      - DATAMCP_STAGE=${DATAMCP_STAGE:-production}
      - DATAMCP_READ_ONLY=${DATAMCP_READ_ONLY:-true}
      
      - DATAMCP_CLOUD_URL=${DATAMCP_CLOUD_URL:-}
      
      # Optional: Friendly name for the agent
      - AGENT_NAME=${AGENT_NAME:-Docker Agent}
      
      # Optional: Heartbeat interval in milliseconds (default: 30000)
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30000}
      
      # Optional: Log level (debug, info, warn, error)
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Optional: HTTP port for health checks (default: 3000)
      - PORT=${PORT:-3000}
    
    # Health checks
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network
    networks:
      - datamcp-network

networks:
  datamcp-network:
    driver: bridge
